<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radiant Emerald to Jade Gradient Base -->
    <linearGradient id="revrec-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- 5-Step Tier Bars Gradients -->
    <linearGradient id="bar-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bar-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>

    <!-- Drop Shadow on Card -->
    <filter id="revrec-shadow" x="50" y="48" width="412" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#064E3B" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#revrec-grad)"/>

  <!-- Top Glass Highlight Reflection -->
  <path d="M0 112C0 50.141 50.141 0 112 0H400C461.859 0 512 50.141 512 112V140C384 100 128 100 0 140V112Z" fill="#FFFFFF" fill-opacity="0.14"/>

  <!-- Main Ceramic Card Plate -->
  <g filter="url(#revrec-shadow)">
    <rect x="86" y="80" width="340" height="340" rx="36" fill="#FFFFFF" fill-opacity="0.98"/>
  </g>

  <!-- Header Badge Pill: REVENUE Pro -->
  <rect x="124" y="112" width="264" height="64" rx="18" fill="#10B981" fill-opacity="0.12"/>
  <text x="256" y="155" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#047857">REVENUE Pro</text>

  <!-- 5-Step Model Tiered Ascending Revenue Staircase -->
  <!-- Step 1 Bar (Contracts) -->
  <rect x="136" y="308" width="40" height="52" rx="8" fill="url(#bar-1)"/>
  <!-- Step 2 Bar (POB) -->
  <rect x="186" y="276" width="40" height="84" rx="8" fill="url(#bar-1)"/>
  <!-- Step 3 Bar (Price) -->
  <rect x="236" y="244" width="40" height="116" rx="8" fill="url(#bar-2)"/>
  <!-- Step 4 Bar (SSP Allocation) -->
  <rect x="286" y="212" width="40" height="148" rx="8" fill="url(#bar-2)"/>
  <!-- Step 5 Bar (Recognized Revenue) -->
  <rect x="336" y="180" width="40" height="180" rx="8" fill="url(#bar-3)"/>

  <!-- Dynamic Catch-Up Trajectory Curve Line -->
  <path d="M146 300C190 280 260 210 356 168" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
  <!-- Trajectory Point -->
  <circle cx="356" cy="168" r="7" fill="#F59E0B"/>

  <!-- Baseline -->
  <line x1="124" y1="368" x2="388" y2="368" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>

  <!-- Revenue Schedule Indicator Pills -->
  <rect x="136" y="386" width="64" height="14" rx="7" fill="#10B981"/>
  <rect x="224" y="386" width="64" height="14" rx="7" fill="#6366F1"/>
  <rect x="312" y="386" width="64" height="14" rx="7" fill="#F59E0B"/>
</svg>
